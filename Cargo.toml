[package]
name = "tensorsc"
version = "0.1.0"
edition = "2024"

[lib]
name = "tensorsc"
# cdylib is the Python extension module; rlib lets `cargo test` and other Rust crates use it.
crate-type = ["cdylib", "rlib"]

[features]
# Python bindings. Off by default so `cargo test` doesn't need to link against Python;
# maturin turns it on (see pyproject.toml).
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true }
